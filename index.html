<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0c0a0b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OUR NETFLIX — Anusha & Vishal's Story</title>
    <meta name="description" content="A private streaming-style memory website for Anusha and Vishal — our story, from 2022 and continuing forever." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('ournetflix-theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.add(dark ? 'dark' : 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0c0a0b' : '#f7f4f2');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
